# Set before `docker compose up`:
#   REDIS_PASSWORD   password for the queue (Redis is not published to the host)
#   OMNIOCR_API_KEYS  "key:tenant,key:tenant" - requests without a listed key get 401
x-omniocr-env: &omniocr-env
  OMNIOCR_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  OMNIOCR_API_KEYS: ${OMNIOCR_API_KEYS:?set OMNIOCR_API_KEYS}
  OMNIOCR_UPLOAD_DIR: /data/uploads
  OMNIOCR_RESULT_DIR: /data/results
  # The api and the worker write their counters here; /metrics on the api adds them up.
  PROMETHEUS_MULTIPROC_DIR: /metrics

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    # No `ports:` - only the api and worker reach it, over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  worker:
    build:
      context: ../..
      dockerfile: editions/server/Dockerfile
    # rq takes the URL as a flag, not from the environment.
    command: ["sh", "-c", "rq worker --url \"$$OMNIOCR_REDIS_URL\" omniocr"]
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - omniocr-data:/data
      - omniocr-metrics:/metrics
    environment: *omniocr-env

  api:
    build:
      context: ../..
      dockerfile: editions/server/Dockerfile
    command: uvicorn editions.server.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - omniocr-data:/data
      - omniocr-metrics:/metrics
    environment: *omniocr-env

volumes:
  omniocr-data:
  omniocr-metrics:

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: editions/cloud/Dockerfile
    command: celery -A editions.cloud.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ../../:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  api:
    build:
      context: ../..
      dockerfile: editions/cloud/Dockerfile
    command: uvicorn editions.cloud.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ../../:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

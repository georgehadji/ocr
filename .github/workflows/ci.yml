name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,docx]"
      - name: Run tests with coverage
        run: python -m pytest --cov=packages/omniocr/src/omniocr --cov-report=term-missing --cov-fail-under=80
      - name: Check lint
        run: ruff check packages tests
      - name: Check formatting
        run: ruff format --check packages tests
      - name: Check strict typing
        run: mypy --strict --ignore-missing-imports --follow-imports=skip --python-version 3.11 packages/omniocr/src
      - name: Check license isolation
        run: python scripts/check_license_isolation.py
      - name: Check architectural layering
        run: python scripts/check_layering.py
      - name: Test CER regression gate
        run: python -m pytest tests/test_regression.py -v
      - name: Check security (bandit)
        run: python -m bandit -r packages/omniocr/src/omniocr -s B101
        if: runner.os == 'ubuntu'
      - name: Check dependency vulnerabilities (pip-audit)
        run: python -m pip_audit
        if: runner.os == 'ubuntu'

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # cloud and server are here for the typing gate, not for convenience:
      # `mypy --strict` over editions/ needs FastAPI, Celery and RQ importable.
      # Without them --ignore-missing-imports silently degrades every route
      # decorator to untyped, and the gate reports 8 errors on correct code.
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,docx,cloud,server,desktop]"
      - name: Run tests with coverage
        run: python -m pytest --cov=packages/omniocr/src/omniocr --cov-report=term-missing --cov-fail-under=80
      # editions/ and scripts/ are gated too. They were excluded until now,
      # and that gap hid 19 lint findings and 71 typing errors — among them a
      # Celery task enqueued with raw bytes under a JSON serializer (every
      # Cloud submit failed), an export whose failure was swallowed into an
      # empty file reported as "completed", and a status endpoint that
      # returned an unrelated job's state.
      # Every static gate below runs even when an earlier one fails.
      #
      # Without this the steps short-circuit, and one failure hides the rest:
      # `ruff check` had nine errors, so `ruff format --check` (ten files) and
      # `mypy --strict` (a variance defect in `Result`) never executed at all.
      # Three independent failures surfaced one per fix-and-push cycle instead
      # of together, and the later two had been accumulating unseen.
      #
      # `always()` rather than `success() || failure()` so the gates still
      # report on a cancelled run. The job's own result is unaffected: a failed
      # step still fails the job, this only stops it short-circuiting.
      - name: Check lint
        if: always()
        run: ruff check packages tests editions scripts
      - name: Check formatting
        if: always()
        run: ruff format --check packages tests editions scripts
      - name: Check strict typing (core)
        if: always()
        run: mypy --strict --ignore-missing-imports --python-version 3.11 packages/omniocr/src
      # Separate invocation: the editions are sibling top-level packages, so
      # they need --explicit-package-bases to resolve `editions.*` and
      # `omniocr.*` in the same run. The search path itself now lives in
      # pyproject's mypy_path — as an env var it had to be spelled with a
      # platform-specific separator, and the POSIX one broke Windows.
      - name: Check strict typing (editions, scripts)
        if: always()
        run: mypy --strict --ignore-missing-imports --python-version 3.11 --explicit-package-bases editions scripts
      - name: Check license isolation
        if: always()
        run: python scripts/check_license_isolation.py
      - name: Check architectural layering
        if: always()
        run: python scripts/check_layering.py
      - name: Test CER regression gate
        if: always()
        run: python -m pytest tests/test_regression.py -v
      - name: Check security (bandit)
        run: python -m bandit -r packages/omniocr/src/omniocr -s B101
        if: always() && runner.os == 'ubuntu'
      - name: Check dependency vulnerabilities (pip-audit)
        run: python -m pip_audit
        if: always() && runner.os == 'ubuntu'

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and source distribution
        run: python -m build

  docker:
    name: Build cloud image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the default Kraken model (Git LFS)
        run: git lfs pull --include="models/$(python3 -c "import json; print(next(m['name'] for m in json.load(open('models/manifest.json', encoding='utf-8'))['models'] if m['engine'] == 'kraken' and m.get('default')))")"
      - name: Build the image
        run: docker build -f editions/cloud/Dockerfile -t omniocr-cloud .
      # The image once shipped without Tesseract, so every job failed at run
      # time. Greek is the whole point: check the packs, not just the binary.
      - name: Tesseract has the Greek packs
        run: docker run --rm --entrypoint tesseract omniocr-cloud --list-langs | grep -x -e ell -e grc | sort | tr '\n' ' ' | grep -x 'ell grc '
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id omniocr-cloud -u)" != 0
      # Each of these was missing once and failed only when a job ran.
      - name: Image has every engine dependency and the verified default Kraken model
        run: |
          docker run --rm --entrypoint python omniocr-cloud -c "
          import cv2, pytesseract, structlog
          from pathlib import Path
          from omniocr.infrastructure.model_manifest import ModelManifest, resolve_kraken_model
          model = Path(resolve_kraken_model())
          assert ModelManifest('models/manifest.json').verify(model.name, model), f'{model} fails its pinned hash'
          print(model)"

  docker-server:
    name: Build server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the default Kraken model (Git LFS)
        run: git lfs pull --include="models/$(python3 -c "import json; print(next(m['name'] for m in json.load(open('models/manifest.json', encoding='utf-8'))['models'] if m['engine'] == 'kraken' and m.get('default')))")"
      - name: Build the image
        run: docker build -f editions/server/Dockerfile -t omniocr-server .
      - name: Tesseract has the Greek packs
        run: docker run --rm --entrypoint tesseract omniocr-server --list-langs | grep -x -e ell -e grc | sort | tr '\n' ' ' | grep -x 'ell grc '
      - name: Image has every engine dependency and the verified default Kraken model
        run: |
          docker run --rm --entrypoint python omniocr-server -c "
          import cv2, pytesseract, structlog, rq
          from pathlib import Path
          from omniocr.infrastructure.model_manifest import ModelManifest, resolve_kraken_model
          model = Path(resolve_kraken_model())
          assert ModelManifest('models/manifest.json').verify(model.name, model), f'{model} fails its pinned hash'
          print(model)"
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id omniocr-server -u)" != 0

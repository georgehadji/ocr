[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniocr"
version = "0.1.0"
description = "OmniOCR core library"
requires-python = ">=3.11"
readme = "docs/BUILD_PLAN.md"
dependencies = []

[project.optional-dependencies]
desktop = []
tesseract = ["pytesseract>=0.3.10", "Pillow>=10.0"]
pdf = ["PyMuPDF>=1.24"]
docx = ["python-docx>=1.1"]
opencv = ["numpy>=1.24", "opencv-python-headless>=4.8"]
kraken = ["kraken>=6.0"]
vlm = []
calamari = ["calamari-ocr>=2.0"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit", "build", "bandit", "pip-audit"]

[tool.setuptools]
package-dir = {"" = "packages/omniocr/src"}

[tool.setuptools.packages.find]
where = ["packages/omniocr/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
